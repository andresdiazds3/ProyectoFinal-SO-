# =============================================================================
# Proyecto final – Administración de Sistemas Operativos (UAO)
# Archivo     : grafana/provisioning/dashboards/dashboards.yml
# Fase        : 4 – Grafana
# Responsable : Persona 2 (dejado listo por Persona 1)
# Propósito   : Le dice a Grafana que cargue solo los dashboards JSON de la
#               carpeta /etc/grafana/dashboards (montada desde grafana/dashboards).
# =============================================================================
apiVersion: 1

providers:
  - name: proyecto-final
    orgId: 1
    folder: Proyecto Final
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/dashboards
