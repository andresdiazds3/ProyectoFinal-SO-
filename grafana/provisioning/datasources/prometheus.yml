# =============================================================================
# Proyecto final – Administración de Sistemas Operativos (UAO)
# Archivo     : grafana/provisioning/datasources/prometheus.yml
# Fase        : 4 – Grafana
# Responsable : Persona 2 (dejado listo por Persona 1)
# Propósito   : Crea la fuente de datos Prometheus al arrancar Grafana.
# =============================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus            # uid fijo: los dashboards JSON lo referencian
    type: prometheus
    access: proxy
    url: http://prometheus:9090   # Grafana habla con Prometheus por nombre de servicio
    isDefault: true
    editable: false
