# Cuántos procesos trabajadores usa Nginx. "auto" = uno por núcleo de CPU.
worker_processes auto;

# Conexiones simultáneas que puede manejar cada trabajador.
events {
  worker_connections 1024;
}

http {
  # Formato del registro de accesos. Además de lo normal, guarda:
  #   upstream = a qué backend se envió la petición
  #   rt       = tiempo total de la petición
  #   urt      = tiempo que tardó el backend en responder
  # Sirve para comprobar el balanceo leyendo los logs.
  log_format main '$remote_addr [$time_local] "$request" $status '
                  'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log main;

  # ---------------------------------------------------------------------------
  # GRUPO DE BACKENDS ("upstream")
  # backend1, backend2 y backend3 son los nombres de los servicios del
  # docker-compose.yml. Docker los resuelve a sus IPs por DNS interno.
  # Sin más opciones, Nginx usa ROUND-ROBIN: 1, 2, 3, 1, 2, 3...
  # (otras estrategias: "least_conn" y "ip_hash").
  # ---------------------------------------------------------------------------
  upstream backend_pool {
    # Memoria compartida entre los procesos trabajadores. Sin esto, cada
    # trabajador (worker_processes auto = uno por núcleo) lleva su propio turno
    # del round-robin y, con pocas peticiones, todas caen en backend1.
    zone backend_pool 64k;

    server backend1:3000;
    server backend2:3000;
    server backend3:3000;
  }

  # ---------------------------------------------------------------------------
  # SERVIDOR PÚBLICO: puerto 80 dentro del contenedor.
  # El compose lo publica como 8080 en tu computador.
  # ---------------------------------------------------------------------------
  server {
    listen 80;

    # /metrics NO debe salir por el proxy: Prometheus consulta cada backend
    # directamente. Si pasara por Nginx, caería en una instancia al azar y las
    # cifras quedarían mezcladas. Por eso devolvemos 404 aquí.
    location = /metrics {
      return 404;
    }

    # Todo lo demás se reenvía al grupo de backends.
    location / {
      proxy_pass http://backend_pool;

      # Cabeceras que conservan la información original del cliente:
      proxy_set_header Host              $host;                        # dominio solicitado
      proxy_set_header X-Real-IP         $remote_addr;                 # IP del cliente
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;   # cadena de proxies
      proxy_set_header X-Forwarded-Proto $scheme;                      # http o https

      # Si un backend está caído, Nginx reintenta la petición con el siguiente
      # (es el comportamiento por defecto; se deja explícito para el informe).
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_connect_timeout 2s;

      # Agrega a la respuesta la IP:puerto del backend que atendió.
      # Muy útil para demostrar el balanceo con "curl -I".
      add_header X-Upstream-Addr $upstream_addr always;
    }
  }

  # ---------------------------------------------------------------------------
  # SERVIDOR INTERNO DE ESTADO: puerto 8081.
  # NO se publica en el compose, así que solo es accesible dentro de la red
  # Docker. Lo lee el "nginx-exporter" para convertirlo en métricas de
  # Prometheus. "stub_status" muestra conexiones activas y total de peticiones.
  # ---------------------------------------------------------------------------
  server {
    listen 8081;

    location = /stub_status {
      stub_status;
      access_log off;   # no llenar el log con las consultas del exportador
    }
  }
}
